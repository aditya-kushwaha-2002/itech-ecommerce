spring.application.name=itech-backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

# Change this long secret before deployment; keep it outside source control in production.
app.auth.secret=replace-this-with-a-long-random-production-secret-2026
app.admin.email=admin@itech.local
app.admin.password=ChangeMe123!
